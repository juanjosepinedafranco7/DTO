# ============================================================
#  CONFIGURACIÓN DE BASE DE DATOS - MySQL
#  ¡IMPORTANTE! Cambia estos valores por los de tu servidor
# ============================================================

# URL de conexión a MySQL
# Formato: jdbc:mysql://HOST:PUERTO/NOMBRE_BASE_DE_DATOS
spring.datasource.url=jdbc:mysql://localhost:3306/taller_dto

# Usuario de MySQL (por defecto suele ser 'root')
spring.datasource.username=root

# Contraseña de MySQL (pon la tuya aquí)
spring.datasource.password=tu_contrasena

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
#  CONFIGURACIÓN DE JPA / HIBERNATE
# ============================================================

# 'update' → Hibernate actualiza la tabla automáticamente si hay cambios
# 'create' → Borra y vuelve a crear las tablas cada vez que arrancas
# 'create-drop' → Igual que create, pero borra al cerrar la app
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola (útil para aprender)
spring.jpa.show-sql=true

# Formatea el SQL para que sea más fácil de leer
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de MySQL para Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
#  NOMBRE Y PUERTO DEL SERVIDOR
# ============================================================

# Puerto donde corre la aplicación (8080 es el predeterminado)
server.port=8080

# Nombre de la aplicación
spring.application.name=taller-dto
